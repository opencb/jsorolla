    <script defer src="./conf/opencga-job-browser.settings.js"></script>
    <script defer src="./conf/opencga-clinical-analysis-browser.settings.js"></script>
    <script defer src="./conf/opencga-clinical-analysis-view.settings.js"></script>
    <script defer src="./conf/opencga-sample-browser.settings.js"></script>
    <script defer src="./conf/opencga-clinical-review-cases.settings.js"></script>
    <script defer src="./conf/variant-interpreter-qc-overview.settings.js"></script>
    <script defer src="./conf/variant-interpreter-browser-rd.settings.js"></script>

    <!-- Load extensions -->
    <script type="text/javascript">window.IVA_EXTENSIONS = [];</script>
    <script type="text/javascript" src="./extensions/extensions.js"></script>

    <style>
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #007bff;
            color: #fff;
            text-align: center;
            font-size: 24px;
            line-height: 46px;
            transition: opacity 0.3s ease;
            opacity: 0;
            z-index: 9999;
        }

        .back-to-top:hover {
            cursor: pointer;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <iva-app></iva-app>
    <!-- Back to Top button -->
    <a href="#" class="back-to-top" id="back-to-top">
        <i class="fa fa-chevron-up text-white"></i>
    </a>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.title = SUITE.name;
            // Show or hide the back-to-top button based on scroll position
            window.addEventListener('scroll', function () {
                if (window.pageYOffset > 100) {
                    document.getElementById('back-to-top').style.opacity = '1';
                } else {
                    document.getElementById('back-to-top').style.opacity = '0';
                }
            });

            // Smooth scroll to top when the button is clicked
            document.getElementById('back-to-top').addEventListener('click', function (e) {
                e.preventDefault();
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
        });
    </script>
</body>
</html>
