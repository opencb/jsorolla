name: "Task workflow for TASK-* branches"

on:
  push:
    branches:
      - "TASK-*"

jobs:
  build:
    uses: ./.github/workflows/build-jsorolla-workflow.yml

  test:
    uses: ./.github/workflows/test.yml
    needs: build
    with:
      test_profile: runShortTests
    # secrets: inherit
    # Note 20250307 Vero: Workaround while github solves issue with inherit reported in
    #   https://github.com/actions/runner/issues/2709#issuecomment-2706001239
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy-docker:
    uses: ./.github/workflows/deploy-docker-jsorolla.yml
    needs: test
    with:
      cli: python3 ./docker/docker-build.py push --tag ${{ github.ref_name }}
    secrets: inherit
