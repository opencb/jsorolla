name: "Develop branch workflow"

on:
  push:
    branches:
      - "develop"
      - "release-*"

jobs:
  build:
    uses: ./.github/workflows/build-jsorolla-workflow.yml

  test:
    uses: ./.github/workflows/test.yml
    needs: build


  deploy-docker:
    uses: ./.github/workflows/deploy-docker-jsorolla.yml
    needs: test
    with:
      cli: python3 ./docker/docker-build.py push --org zettagenomics
    secrets: inherit

  deploy-web:
    uses: ./.github/workflows/deploy-jsorolla-web-workflow.yml
    needs: [ build, test ]
    with:
      version: ${{ needs.build.outputs.version }}
    secrets: inherit
