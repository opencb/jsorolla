# Example GitHub Actions workflow (template) for JavaScript projects
# Trigger: manual (workflow_dispatch) with inputs for base and head refs.
# Purpose: Compare vulnerabilities (including JS dependencies) between two branches/commits.
# Usage: Copy this file into .github/workflows/vuln-diff-js.yml of your JS repository and adapt refs.

name: Vulnerability Diff (JavaScript Manual)

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base ref (branch/tag/SHA) e.g. develop"
        required: true
        default: "develop"
      head_ref:
        description: "Head ref (branch/tag/SHA) e.g. TASK-7908"
        required: true
        default: "TASK-7908"
      include_dev_dependencies:
        description: "Include devDependencies from package.json? (true/false)"
        required: true
        default: "true"

permissions:
  contents: read
  # pull-requests: write  # (Only if you later enable PR comment integration)

jobs:
  vuln-diff-js:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout head ref
        uses: actions/checkout@v4
        with:
          # Head ref provided by workflow_dispatch input
          ref: ${{ inputs.head_ref }}
          fetch-depth: 0   # Need full history for ref resolution
          fetch-tags: true

      - name: Ensure base ref is fetched (if it's a branch)
        run: |
          git fetch origin ${{ inputs.base_ref }}:refs/remotes/origin/${{ inputs.base_ref }} --tags --prune || echo "Base ref might be a SHA already present"

      - name: Vulnerability Diff (JavaScript)
        uses: sec-open/vuln-diff-action@v2.0.0-alpha.3
        with:
          base_ref: ${{ inputs.base_ref }}
          head_ref: ${{ inputs.head_ref }}
          path: .

